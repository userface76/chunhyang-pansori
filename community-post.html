<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>게시글 | 판소리연구소 춘향</title><link rel="stylesheet" href="./style.css"><style>main{max-width:1000px;margin:auto;padding:45px 20px 100px}.post-text{white-space:pre-wrap;line-height:1.9;margin:35px 0;min-height:140px}.files a{display:block;margin:10px 0}.back{display:inline-block;padding:12px 20px;background:#098b8c;color:white;text-decoration:none;border-radius:5px}</style></head><body><header class="site-header"><a class="brand" href="./index.html"><img class="brand-img" src="./assets/chunhyang-header.png" alt="판소리연구소 춘향"></a><nav><a href="./community.html">소통</a></nav></header><main><h1 id="title">게시글 불러오는 중</h1><p id="meta"></p><hr><article id="body" class="post-text"></article><div class="files" id="files"></div><p><a class="back" id="back" href="./community.html">목록으로</a></p></main><script>(async()=>{const id=new URLSearchParams(location.search).get('id');if(!/^\d+$/.test(id||'')){document.getElementById('title').textContent='잘못된 게시글';return}try{const r=await fetch('/api/posts/'+id);if(!r.ok)throw Error();const {post,files}=await r.json();document.getElementById('title').textContent=post.title;document.getElementById('meta').textContent=post.author_name+' · '+(post.published_at||post.created_at||'').slice(0,10);const body=document.getElementById('body');body.replaceChildren();const images=new Map((files||[]).filter(f=>f.kind==='image').map(f=>[Number(f.id),f]));const bits=String(post.content||'').split(/(\[\[image:\d+\]\])/g);for(const bit of bits){const m=/^\[\[image:(\d+)\]\]$/.exec(bit);if(m){const f=images.get(Number(m[1]));if(f){const figure=document.createElement('figure');figure.style.cssText='margin:24px auto;text-align:center';const img=document.createElement('img');img.src='/api/files/'+f.id;img.alt=f.original_name||'게시글 사진';img.loading='lazy';img.style.cssText='display:block;max-width:100%;height:auto;margin:auto;border-radius:8px';figure.append(img);body.append(figure)}else body.append(document.createTextNode('[이미지를 찾을 수 없습니다]'))}else body.append(document.createTextNode(bit))}const box=document.getElementById('files');(files||[]).forEach(f=>{const a=document.createElement('a');a.href='/api/files/'+f.id;a.textContent='📎 '+f.original_name;a.setAttribute('download',f.original_name);box.append(a)});if(/^[a-z-]+$/.test(post.board))document.getElementById('back').href='./community-'+post.board+'.html'}catch{document.getElementById('title').textContent='게시글을 불러올 수 없습니다.'}})()</script></body></html>
