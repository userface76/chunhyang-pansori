<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>춘향 게시판 관리</title><link rel="stylesheet" href="./style.css"><style>body{background:#f6f7f7;color:#1b292b}.admin{max-width:960px;margin:32px auto;padding:20px}.panel{background:white;padding:24px;border-radius:12px;box-shadow:0 2px 12px #0001;margin-bottom:20px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-weight:700;margin:12px 0 5px}input,select,textarea{font:inherit;width:100%;box-sizing:border-box;padding:12px;border:1px solid #cdd6d6;border-radius:5px}textarea{min-height:270px}button{font:inherit;padding:11px 16px;cursor:pointer;border:none;border-radius:5px;background:#088a88;color:white;margin:6px 5px 6px 0}.muted{color:#666}.danger{background:#a32929}.entry{padding:12px;border-bottom:1px solid #ddd}.entry button{padding:6px 12px}.file{display:flex;align-items:center;gap:12px}.hidden{display:none}#status{white-space:pre-wrap;font-weight:700}</style></head><body><main class="admin"><h1>판소리연구소 춘향 · 게시판 관리</h1><p>게시글·사진·문서 업로드 관리 (관리자 전용)</p><section class="panel" id="login"><label for="token">관리자 API 비밀키</label><input id="token" type="password" autocomplete="off" placeholder="Cloudflare ADMIN_API_TOKEN 값"><button id="enter">관리자 인증</button><p class="muted">비밀키는 브라우저 세션에만 보관됩니다. 공용 컴퓨터에서는 창을 닫고 로그아웃하세요.</p></section><section id="dashboard" class="hidden"><div class="panel"><div class="formgrid"><div><label for="board">게시판</label><select id="board"><option value="notices">공지사항</option><option value="press">언론보도</option><option value="newsletters">소식지</option><option value="gallery">갤러리</option><option value="resources">자료실</option><option value="finance">재정보고</option></select></div><div><label for="author">작성자</label><input id="author" value="춘향관리자"></div></div><label for="title">제목</label><input id="title" maxlength="200"><label for="content">내용</label><textarea id="content" maxlength="100000"></textarea><div class="formgrid"><div><label for="visibility">공개 상태</label><select id="visibility"><option value="published">공개</option><option value="draft">비공개 임시저장</option></select></div><div><label><input id="pinned" type="checkbox" style="width:auto"> 공지 상단 고정</label></div></div><label for="attachments">첨부파일 (이미지·PDF·문서·ZIP·MP4, 파일당 15MB)</label><input id="attachments" type="file" multiple accept=".jpg,.jpeg,.png,.webp,.gif,.pdf,.txt,.docx,.xlsx,.pptx,.hwp,.hwpx,.zip,.mp4"><div id="attached"></div><button id="save">글 등록</button><button id="reset" type="button">새 글</button><button id="logout" type="button" class="danger">로그아웃</button><p role="status" id="status"></p></div><div class="panel"><h2>게시글 관리</h2><button id="reload">목록 새로고침</button><div id="list"></div></div></section></main><script src="./community-admin.js" defer></script></body></html>
